name: Mirror

# Pushes this repository to its mirrors on every push to main: the school's repository (the
# hand-in) and the personal one Vercel deploys from. Each target does nothing until its repository
# variable and deploy-key secret exist: see docs/deploy.md#mirrors.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [EPITECH, PERSONAL]
    steps:
      - name: Check this target is configured
        id: configured
        env:
          REPOSITORY: ${{ vars[format('{0}_REPOSITORY', matrix.target)] }}
        run: echo "ok=$([ -n "${REPOSITORY:-}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.configured.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - name: Push every branch and tag
        if: steps.configured.outputs.ok == 'true'
        env:
          DEPLOY_KEY: ${{ secrets[format('{0}_DEPLOY_KEY', matrix.target)] }}
          REPOSITORY: ${{ vars[format('{0}_REPOSITORY', matrix.target)] }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "${{ matrix.target }}_DEPLOY_KEY is not set: see docs/deploy.md#mirrors" >&2
            exit 1
          fi
          host=${REPOSITORY#ssh://}
          host=${host#*@}
          host=${host%%:*}
          host=${host%%/*}
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"
          git remote add mirror "$REPOSITORY"
          git push --mirror mirror
