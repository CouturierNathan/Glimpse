name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install local PDF and OCR tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils tesseract-ocr
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
